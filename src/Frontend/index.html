<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/earlyaccess/droidarabickufi.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="icon" type="image/png" href="/images/white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المعهد التكنولوجي لهندسة التشييد والإدارة</title>
    <meta name="description"
          content="الموقع الرسمي للمعهد التكنولوجي لهندسة التشييد والإدارة " />
</head>
<body style="background-color: #ffffff;">
    <div id="root"></div>
    <script>
        function completeCallback(resultIndicator) {
            if (window.completeCallbackReact) {
                window.completeCallbackReact(resultIndicator);
            }
        }
        function errorCallback(error) {
            if (window.errorCallbackReact) {
                window.errorCallbackReact(error);
            }
        }
        function cancelCallback() {
            if (window.cancelCallbackReact) {
                window.cancelCallbackReact();
            }
        }
    </script>
    <script src="https://banquemisr.gateway.mastercard.com/static/checkout/checkout.min.js"
            data-error="errorCallback"
            data-cancel="cancelCallback"
            data-complete="completeCallback">
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
